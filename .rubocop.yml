require:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'

# レイアウト設定
Layout/LineLength:
  Max: 120

# メトリクス設定
Metrics/ClassLength:
  Max: 200

Metrics/MethodLength:
  Max: 30

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - 'Rakefile'

Metrics/AbcSize:
  Max: 30

# スタイル設定
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

# 命名規則
Naming/MethodParameterName:
  MinNameLength: 1

# Minitest設定
Minitest/MultipleAssertions:
  Enabled: false
